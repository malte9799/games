name: Deploy (main + branch previews)

# main → https://<owner>.github.io/<repo>/
# every other branch → https://<owner>.github.io/<repo>/previews/<branch>/
# Published on the `gh-pages` branch (Settings → Pages → Source: Deploy from a branch → gh-pages / root).

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Names
        id: n
        run: |
          slug=$(bash scripts/gh-pages.sh slug "$BRANCH")
          if [ "$BRANCH" = "main" ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=previews/$slug" >> "$GITHUB_OUTPUT"; fi
          if [ "$BRANCH" != "main" ]; then
            echo "URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/$slug/" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Preview title + meta
        if: steps.n.outputs.dir != '.'
        run: |
          pr=""; title=""
          if meta=$(gh pr view "$BRANCH" --repo "$REPO" --json number,title 2>/dev/null); then
            pr=$(jq -r .number <<<"$meta"); title=$(jq -r .title <<<"$meta")
            label="Preview - #$pr $title"
          else
            label="Preview - $BRANCH"
          fi
          PREVIEW_TITLE="$label" node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const f = "dist/index.html";
            writeFileSync(f, readFileSync(f, "utf8").replace(/<title>[\s\S]*?<\/title>/, `<title>${esc(process.env.PREVIEW_TITLE)}</title>`));
          '
          jq -n --arg branch "$BRANCH" --arg commit "$SHA" --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg pr "${pr:-null}" --arg title "$title" \
                '{branch: $branch, commit: $commit, published: $published, pr: ($pr | if . != "null" then tonumber else null end), title: $title}' > dist/meta.json
      - name: Publish to gh-pages
        run: bash scripts/gh-pages.sh publish "${{ steps.n.outputs.dir }}" dist
      - name: Pages setup (main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then echo "Pages already configured"; exit 0; fi
          gh api -X POST "repos/$REPO/pages" -f "source=gh-pages|/" 2>/dev/null || \
            gh api -X POST "repos/$REPO/pages" --input - <<< '{"source":{"branch":"gh-pages","path":"/"}}'
      - name: Comment preview URL
        if: steps.n.outputs.dir != '.'
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)
          [[ "$pr" =~ ^[0-9]+$ ]] || exit 0
          body="<!-- preview --> [$URL]($URL)"
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate -q '[.[] | select(.body | contains("<!-- preview -->"))][0].id' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
          fi