name: PR preview status

# Post the preview URL as soon as a PR is opened/reopened.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Comment preview URL
        run: |
          slug=$(printf '%s' "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/$slug/"
          pr="$PR"
          body="[$URL]($URL) <!-- preview -->"
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate -q '[.[] | select(.body | contains("<!-- preview -->"))][0].id' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
          fi